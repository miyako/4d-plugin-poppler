name: Build patched Brotli

on:
  push:
    paths:
      - '.github/workflows/build-brotli.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BROTLI_COMMIT: db24a98aed38a16de78cc05ca15cdd8dc2a0d92d # v1.2.1

jobs:
  brotli-windows:
    name: Brotli DLLs (Windows x64)
    runs-on: windows-latest
    steps:
      - name: checkout Brotli 1.2.1 (CVE-2026-111497 fix)
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: ${{ env.BROTLI_COMMIT }}
          path: brotli-src

      - name: build shared libraries (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S brotli-src -B brotli-build -A x64 -DBUILD_SHARED_LIBS=ON "-DCMAKE_INSTALL_PREFIX=$PWD/brotli-out"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build brotli-build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir brotli-build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install brotli-build --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item brotli-out/bin/brotli*.dll vendor/
          Get-ChildItem vendor | Format-Table Name, Length
          foreach ($d in 'brotlicommon','brotlidec','brotlienc') {
            dumpbin /headers "vendor/$d.dll" | Select-String 'machine'
            dumpbin /exports "vendor/$d.dll" | Select-String 'Brotli'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: brotli-windows-dlls
          path: vendor/
          if-no-files-found: error
